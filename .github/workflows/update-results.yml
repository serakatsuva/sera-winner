name: Update Sera Winner results

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-results.yml'
      - 'scripts/update-results.mjs'
  schedule:
    - cron: '15 2,13,17,21,23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sera-winner-results
  cancel-in-progress: true

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify finished predicted matches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESULTS_MODEL: gpt-5.6-luna
        run: node scripts/update-results.mjs

      - name: Commit verified results
        run: |
          git config user.name "sera-winner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No new verified results."
          else
            git commit -m "Update Sera Winner verified results"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

  deploy:
    needs: results
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
