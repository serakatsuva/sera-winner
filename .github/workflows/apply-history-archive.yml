name: Apply prediction history archive

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/apply-history-archive.yml'
      - 'scripts/patch-history-archive.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/patch-history-archive.mjs
      - run: |
          git config user.name "sera-winner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/update-predictions.mjs
          if git diff --cached --quiet; then
            echo "History archive already applied."
          else
            git commit -m "Archive daily Sera Winner predictions"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
