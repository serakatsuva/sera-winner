name: Sera Indicator — Weltrade H1 H4 + OpenAI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-indicator.yml'
      - 'indicator/index.html'
      - 'indicator/styles.css'
      - 'indicator/weltrade.css'
      - 'indicator/app.js'
      - 'indicator/scripts/update-signals.mjs'
      - 'indicator/data/weltrade-candles.json'
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sera-indicator-weltrade-signals
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test signal engine
        run: node indicator/scripts/update-signals.mjs --self-test

      - name: Analyze fresh Weltrade MT5 candles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCREENING_MODEL: gpt-5.6-luna
          DEEP_MODEL: gpt-5.6-sol
        run: node indicator/scripts/update-signals.mjs

      - name: Commit signal status
        run: |
          git config user.name "sera-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add indicator/data/signals.json
          if git diff --cached --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "Update Sera Indicator Weltrade signals"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
