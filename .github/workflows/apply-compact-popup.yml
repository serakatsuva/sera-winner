name: Apply compact welcome popup

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/apply-compact-popup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply compact popup patch
        run: node scripts/compact-welcome-popup.mjs
      - name: Commit UI update
        run: |
          git config user.name "sera-winner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make welcome popup compact and professional"
          git pull --rebase origin main
          git push origin main
