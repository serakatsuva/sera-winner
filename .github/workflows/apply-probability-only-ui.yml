name: Apply probability-only recommendation UI

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/apply-probability-only-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply probability-only UI
        run: node scripts/apply-probability-only-ui.mjs
      - name: Commit UI update
        run: |
          git config user.name "sera-winner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Show core probability prediction instead of exact score"
            git pull --rebase origin main
            git push origin main
          fi
