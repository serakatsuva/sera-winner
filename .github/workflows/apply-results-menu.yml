name: Apply results menu

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/apply-results-menu.yml'
      - 'scripts/patch-results-menu.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/patch-results-menu.mjs
      - run: |
          git config user.name "sera-winner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Results menu already applied."
          else
            git commit -m "Add Sera Winner results comparison menu"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
