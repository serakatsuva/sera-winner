name: Remove OpenAI secret UI text

on:
  push:
    branches: ["main"]
    paths:
      - 'scripts/remove-openai-secret-text.mjs'
      - '.github/workflows/remove-openai-secret-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove sentence
        run: node scripts/remove-openai-secret-text.mjs
      - name: Commit UI update
        run: |
          git config user.name "goaliq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No UI change needed."
          else
            git commit -m "Remove OpenAI secret browser note"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
