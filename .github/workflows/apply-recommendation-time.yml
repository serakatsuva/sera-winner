name: Apply recommendation kickoff time

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/apply-recommendation-time.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply recommendation kickoff patch
        run: node scripts/add-recommendation-time.mjs
      - name: Commit UI update
        run: |
          git config user.name "sera-winner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show kickoff time in recommended predictions"
          git pull --rebase origin main
          git push origin main
