name: Update GoalIQ AI predictions

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-predictions.yml'
      - 'scripts/update-predictions.mjs'
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: goaliq-predictions
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured as a Repository secret."
            exit 1
          fi
          echo "OpenAI API key is configured."

      - name: Run Winner + GPT-5.6 Sol analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          MAX_MATCHES: '100'
        run: node scripts/update-predictions.mjs

      - name: Commit updated predictions
        run: |
          git config user.name "goaliq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/predictions.json
          if git diff --cached --quiet; then
            echo "No prediction changes to commit."
          else
            git commit -m "Update GoalIQ AI predictions"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
